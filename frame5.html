</div>

</div>

<div class="row mb-3">

<div class="col-md-6">

</select>
</div>

<div class="col-md-6">

<option>10:00</option>
<option>12:00</option>
<option>14:00</option>
<option>16:00</option>
<option>18:00</option>
<option>20:00</option>
</select>
</div>

</div>

placeholder="+7 (___) ___-__-__" required>
